name: LinkedIn Intern Job Alert

on:
  schedule:
    - cron: "*/10 * * * *"   # backup timer (GitHub often runs this late)
  workflow_dispatch:          # cron-job.org triggers this every 5 minutes

concurrency:                  # never run two checks at the same time
  group: job-alert
  cancel-in-progress: false

permissions:
  contents: read              # the bot never commits; seen jobs live in the Actions cache

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      # Load the list of already-notified jobs from the latest run's cache.
      - name: Restore seen jobs
        uses: actions/cache/restore@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: seen-jobs-

      - name: Check for new jobs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python job_alert.py

      # Store the updated list for the next run (no commit to the repo).
      - name: Save seen jobs
        if: always() && hashFiles('seen_jobs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}-${{ github.run_attempt }}
